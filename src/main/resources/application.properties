spring.application.name=recipe-data-lab
server.address=${RECIPE_BIND_ADDRESS:127.0.0.1}
server.port=${RECIPE_PORT:8080}
spring.datasource.url=${RECIPE_DB_URL:jdbc:postgresql://127.0.0.1:55438/recipes}
spring.datasource.username=${RECIPE_DB_USER:recipe_lab}
spring.datasource.password=${RECIPE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${RECIPE_DB_POOL_SIZE:8}
spring.sql.init.mode=always
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true
