services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipe_lab
      POSTGRES_PASSWORD: ${RECIPE_DB_PASSWORD:?Set RECIPE_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - recipes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_lab -d recipes"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  recipes_data:
